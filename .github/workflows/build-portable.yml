name: Build portable exe

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional: existing or new tag (e.g. v1.0.27) to attach the built exe to as a GitHub Release asset'
        required: false
        default: ''
  push:
    branches:
      - main
      - codex/publish-keyviz-multi-monitor
      - claude-fix-1.0.27
      - claude-fix-1.0.28
      - claude-fix-1.0.29
      - claude-fix-1.0.30
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci

      - name: Build portable executable
        run: npm run build:portable

      - name: Test radial shortcut validation
        run: |
          node scripts/test-radial-shortcut.mjs
          node scripts/test-drawing-themes.mjs

      - name: Test native object editing
        env:
          KEYVIZ_RADIAL_PREVIEW: ${{ github.workspace }}/release/radial-menu-preview.bmp
          KEYVIZ_RADIAL_STYLES_PREVIEW_DIR: ${{ github.workspace }}/release/radial-styles
        run: cargo test --release --manifest-path src-tauri/Cargo.toml --lib hover_tests

      - name: Prepare portable artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release
          Copy-Item src-tauri/target/release/keyviz.exe release/keyviz-portable.exe

      - uses: actions/upload-artifact@v4
        with:
          name: keyviz-portable
          path: release/keyviz-portable.exe

      - uses: actions/upload-artifact@v4
        with:
          name: keyviz-radial-preview
          path: release/radial-menu-preview.bmp

      - uses: actions/upload-artifact@v4
        with:
          name: keyviz-radial-styles
          path: release/radial-styles/*.bmp

      - name: Publish GitHub Release (version tags or manual release_tag)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          $tag = if ($env:INPUT_TAG) { $env:INPUT_TAG } else { "${{ github.ref_name }}" }
          $notes = "release-notes-$tag.md"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            # Release already exists (e.g. created in the web UI): attach/replace the exe
            gh release upload $tag release/keyviz-portable.exe --clobber
            if ($LASTEXITCODE -ne 0) { exit 1 }
          } else {
            if (Test-Path $notes) {
              gh release create $tag release/keyviz-portable.exe --title "Keyviz $tag" --notes-file $notes --latest
            } else {
              gh release create $tag release/keyviz-portable.exe --title "Keyviz $tag" --generate-notes --latest
            }
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
